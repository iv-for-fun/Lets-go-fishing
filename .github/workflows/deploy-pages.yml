name: Deploy to GitHub Pages

# Publishes the site to GitHub Pages. config.js is gitignored (see
# config.example.js) so real API keys are never committed to the repo;
# this workflow generates it at deploy time from the OPENWEATHER_API_KEY
# repository secret, then uploads the whole (client-side only, no build
# step otherwise) repo as the Pages artifact.
#
# One-time setup required, done by a repo admin in the GitHub UI:
#   1. Settings -> Secrets and variables -> Actions -> New repository secret
#      named OPENWEATHER_API_KEY, value = your OpenWeatherMap API key.
#   2. Settings -> Pages -> Build and deployment -> Source -> GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate config.js from repository secret
        run: |
          cat > config.js <<EOF
          // config.js — generated at deploy time from repo secrets, do not edit.
          const CONFIG = {
            OPENWEATHER_API_KEY: "${{ secrets.OPENWEATHER_API_KEY }}",
            MAPBOX_API_KEY: "",
            STORMGLASS_API_KEY: ""
          };
          EOF

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
