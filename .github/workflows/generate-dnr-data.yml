name: Generate DNR Data

# Populates per-state public fishing-access data (data/dnr/{ABBR}.json) and the
# manifest (data/dnr/index.json) from OpenStreetMap via Overpass, using
# tools/build_dnr_data.py. Runs here (not in a sandbox) because Overpass must be
# reachable. Curated files (those with "curated": true, e.g. GA) are preserved.
#
# Trigger manually from the Actions tab. Optionally pass a space-separated list
# of state abbreviations to (re)build only those; leave blank to build all.

on:
  workflow_dispatch:
    inputs:
      states:
        description: 'Space-separated state abbrs to build (blank = all states)'
        required: false
        default: ''

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build DNR data from OpenStreetMap
        run: |
          echo "Building DNR data (states='${{ github.event.inputs.states }}')"
          python3 tools/build_dnr_data.py ${{ github.event.inputs.states }}

      - name: Commit generated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dnr
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Generate DNR public-access data from OpenStreetMap (Overpass)"
            git push
          fi
