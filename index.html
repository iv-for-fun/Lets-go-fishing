<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Let's Go Fishing 🎣</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root { --green: #2D6A4F; --blue: #48CAE4; --sand: #F4E285; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 1s linear infinite; }
    .tab-btn { @apply px-5 py-3 text-xs font-bold uppercase tracking-wider transition-all duration-200 border-b-2 border-transparent; }
    .tab-active   { @apply border-green-700 text-green-700 bg-white; }
    .tab-inactive { @apply text-gray-400 bg-gray-50 hover:bg-gray-100 hover:text-gray-600; }
    #mapContainer { height: calc(100dvh - 180px); width: 100%; }
    .leaflet-popup-content-wrapper { border-radius: 12px; }
    .map-marker-excellent { background:#22c55e; border:2px solid #fff; border-radius:50%; width:18px; height:18px; box-shadow:0 2px 6px rgba(0,0,0,.3); }
    .map-marker-good      { background:#eab308; border:2px solid #fff; border-radius:50%; width:18px; height:18px; box-shadow:0 2px 6px rgba(0,0,0,.3); }
    .map-marker-poor      { background:#ef4444; border:2px solid #fff; border-radius:50%; width:18px; height:18px; box-shadow:0 2px 6px rgba(0,0,0,.3); }
  </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800">
  <header class="sticky top-0 z-20 bg-white shadow-md px-4 py-3">
    <div class="flex items-center justify-between">
      <h1 class="text-xl font-bold text-green-800 flex items-center gap-2">
        <span>🎣</span> Let's Go Fishing
      </h1>
    </div>
    <div class="flex flex-wrap gap-2 mt-3">
      <div class="flex-1 min-w-[200px]">
        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wide block mb-1" for="locationInput">Your Location</label>
        <input id="locationInput" type="text" placeholder="City, State or 'Current'"
          class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-green-500 outline-none min-h-[44px]" />
      </div>
      <div class="w-24">
        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wide block mb-1" for="driveTime">Max Drive</label>
        <select id="driveTime" class="w-full border rounded-lg px-2 py-2 text-sm min-h-[44px]">
          <option value="0.5">30 min</option>
          <option value="1.0">1 hr</option>
          <option value="1.5" selected>1.5 hr</option>
          <option value="2.5">2.5 hr</option>
          <option value="4.0">4 hr</option>
        </select>
      </div>
      <div class="w-20">
        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wide block mb-1" for="childAge">Kid Age</label>
        <input id="childAge" type="number" min="1" max="15" value="6"
          class="w-full border rounded-lg px-2 py-2 text-sm min-h-[44px]" />
      </div>
      <button id="searchBtn"
        class="bg-green-700 hover:bg-green-800 text-white px-5 py-2 rounded-lg text-sm font-bold min-h-[44px] self-end shadow-sm transition-all active:scale-95">
        Find Spots
      </button>
    </div>
  </header>

  <!-- Banners -->
  <div id="gpsBanner" style="display:none;" class="bg-yellow-50 border-b border-yellow-200 px-4 py-2 text-[11px] text-yellow-800 font-medium">
    📍 Using manual location — Geolocation access was denied or unavailable.
  </div>
  <div id="weatherBanner" style="display:none;" class="bg-blue-50 border-b border-blue-200 px-4 py-2 text-[11px] text-blue-800 font-medium">
    🌤️ Using estimated weather — Live data requires an API key in config.js.
  </div>

  <!-- List View -->
  <main id="listView" class="px-4 py-5 max-w-2xl mx-auto pb-24">
    <div id="loadingState" style="display:none;" class="text-center py-20">
      <div class="spinner inline-block w-8 h-8 border-4 border-green-700 border-t-transparent rounded-full mb-3"></div>
      <p class="text-gray-400 text-xs font-bold uppercase tracking-widest">Searching Waters...</p>
    </div>
    <div id="cardContainer" class="space-y-4"></div>
  </main>

  <!-- Map View -->
  <div id="mapView" style="display:none;" class="pb-20">
    <div id="mapContainer"></div>
    <div id="mapEmptyState" style="display:none;" class="text-center py-12 text-gray-400 text-sm px-6">
      <div class="text-4xl mb-3">🗺️</div>
      <p class="font-bold">No results to map yet.</p>
      <p class="text-xs mt-1">Search for spots first, then switch to the Map tab.</p>
    </div>
  </div>

  <!-- Saved View -->
  <div id="savedView" style="display:none;" class="px-4 py-5 max-w-2xl mx-auto pb-24">
    <h2 class="text-base font-black text-gray-700 mb-4">⭐ Saved Spots</h2>
    <div id="savedContainer" class="space-y-4"></div>
  </div>

  <!-- Detail View -->
  <div id="detailView" style="display:none;" class="max-w-2xl mx-auto px-4 py-5 pb-24">
    <button onclick="showListView()" class="flex items-center gap-2 text-green-700 font-bold text-sm mb-5 hover:translate-x-[-4px] transition-transform">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
      Back to results
    </button>
    <div id="detailContent"></div>
  </div>

  <!-- Bottom Nav -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around py-3 z-20 shadow-lg">
    <button id="navExplore" onclick="showListView()" class="flex flex-col items-center text-[10px] font-bold uppercase text-green-700 min-w-[44px] min-h-[44px] justify-center">
      <svg class="w-6 h-6 mb-1" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path></svg>
      Explore
    </button>
    <button id="navMap" onclick="showMapView()" class="flex flex-col items-center text-[10px] font-bold uppercase text-gray-400 min-w-[44px] min-h-[44px] justify-center">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7l6-3 5.447 2.724a1 1 0 01.553.894v10.764a1 1 0 01-1.447.894L15 17l-6 3z"></path></svg>
      Map
    </button>
    <button id="navSaved" onclick="showSavedView()" class="flex flex-col items-center text-[10px] font-bold uppercase text-gray-400 min-w-[44px] min-h-[44px] justify-center">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>
      Saved
    </button>
  </nav>

  <script src="config.js"></script>
  <script src="scorer.js"></script>
  <script src="enrichment.js"></script>
  <script src="app.js"></script>
  <script>
    let allResults = [];
    let _leafletMap = null;
    let _leafletMarkers = [];

    // ---------- Nav state ----------
    function setNavActive(id) {
      ['navExplore','navMap','navSaved'].forEach(n => {
        document.getElementById(n).className =
          n === id
            ? 'flex flex-col items-center text-[10px] font-bold uppercase text-green-700 min-w-[44px] min-h-[44px] justify-center'
            : 'flex flex-col items-center text-[10px] font-bold uppercase text-gray-400 min-w-[44px] min-h-[44px] justify-center';
      });
    }

    function hideAllViews() {
      ['listView','mapView','savedView','detailView'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = 'none';
      });
    }

    function showListView() {
      hideAllViews();
      document.getElementById('listView').style.display = 'block';
      setNavActive('navExplore');
      window.scrollTo(0, 0);
    }

    function showSavedView() {
      hideAllViews();
      document.getElementById('savedView').style.display = 'block';
      setNavActive('navSaved');
      renderSavedSpots();
      window.scrollTo(0, 0);
    }

    // ---------- Map View ----------
    function showMapView() {
      hideAllViews();
      document.getElementById('mapView').style.display = 'block';
      setNavActive('navMap');

      if (!allResults || allResults.length === 0) {
        document.getElementById('mapEmptyState').style.display = 'block';
        document.getElementById('mapContainer').style.display = 'none';
        return;
      }

      document.getElementById('mapEmptyState').style.display = 'none';
      document.getElementById('mapContainer').style.display = 'block';

      // Init map once
      if (!_leafletMap) {
        _leafletMap = L.map('mapContainer', { zoomControl: true });
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
          maxZoom: 18
        }).addTo(_leafletMap);
      }

      // Clear old markers
      _leafletMarkers.forEach(m => m.remove());
      _leafletMarkers = [];

      const bounds = [];

      allResults.forEach(loc => {
        const markerClass = loc.score >= 70 ? 'map-marker-excellent'
                          : loc.score >= 40 ? 'map-marker-good'
                          : 'map-marker-poor';
        const icon = L.divIcon({
          className: '',
          html: `<div class="${markerClass}"></div>`,
          iconSize: [18, 18],
          iconAnchor: [9, 9],
          popupAnchor: [0, -12]
        });

        const scoreLabel = loc.score >= 70 ? '🟢 Excellent' : loc.score >= 40 ? '🟡 Good' : '🔴 Poor';
        const marker = L.marker([loc.coordinates.lat, loc.coordinates.lng], { icon })
          .addTo(_leafletMap)
          .bindPopup(`
            <div style="min-width:180px">
              <p style="font-weight:800;font-size:13px;margin-bottom:4px">${loc.name}</p>
              <p style="font-size:11px;color:#555;margin-bottom:6px">${scoreLabel} &nbsp;•&nbsp; Score: ${loc.score}</p>
              <p style="font-size:11px;color:#555;margin-bottom:6px">📍 ${loc.distMiles} mi &nbsp;•&nbsp; 🚗 ~${Math.round(loc.estDriveHours * 60)} min</p>
              <button onclick="showDetailView('${loc.id}')" style="background:#2D6A4F;color:#fff;border:none;padding:6px 12px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;width:100%">View Details</button>
            </div>
          `);

        _leafletMarkers.push(marker);
        bounds.push([loc.coordinates.lat, loc.coordinates.lng]);
      });

      if (bounds.length > 0) {
        _leafletMap.fitBounds(bounds, { padding: [40, 40] });
      }

      // Invalidate size after view is shown (fixes grey tile issue)
      setTimeout(() => _leafletMap && _leafletMap.invalidateSize(), 100);
    }

    // ---------- Score badge / tag ----------
    function scoreBadge(score) {
      const color = score >= 70 ? 'bg-green-500' : score >= 40 ? 'bg-yellow-500' : 'bg-red-500';
      const label = score >= 70 ? 'Excellent' : score >= 40 ? 'Good' : 'Poor';
      return `<span class="${color} text-white text-[10px] font-black uppercase px-2 py-1 rounded-md shadow-sm">${label} ${score}</span>`;
    }

    function tagPill(label, color = 'bg-gray-100 text-gray-600') {
      return `<span class="text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider ${color}">${label}</span>`;
    }

    // ---------- Detail view ----------
    function showDetailView(locId) {
      const saved = getSavedSpots();
      const loc = allResults.find(l => l.id === locId) || saved.find(l => l.id === locId);
      if (!loc) return;
      hideAllViews();
      document.getElementById('detailView').style.display = 'block';
      window.scrollTo(0, 0);
      if (typeof renderDetailContent === 'function') renderDetailContent(loc);
    }

    // ---------- Tab switching ----------
    function switchTab(tabName, locId) {
      const tabs = ['overview', 'fish', 'amenities', 'forecast'];
      tabs.forEach(t => {
        const el  = document.getElementById(`tab-${t}`);
        const btn = document.getElementById(`btn-${t}`);
        if (el)  el.style.display  = t === tabName ? 'block' : 'none';
        if (btn) btn.className = `tab-btn flex-1 ${t === tabName ? 'tab-active' : 'tab-inactive'}`;
      });
      if (tabName === 'forecast') {
        const saved = getSavedSpots();
        const loc = allResults.find(l => l.id === locId) || saved.find(l => l.id === locId);
        if (loc) renderForecast(loc);
      }
    }

    // ---------- Moon helpers ----------
    function getMoonPhase(date) {
      const refNew = new Date('2000-01-06T18:14:00Z');
      const diffDays = (date - refNew) / (1000 * 60 * 60 * 24);
      return (diffDays % 29.53) / 29.53;
    }

    function getMoonIcon(phase) {
      if (phase < 0.0625 || phase >= 0.9375) return '🌑';
      if (phase < 0.1875) return '🌒';
      if (phase < 0.3125) return '🌓';
      if (phase < 0.4375) return '🌔';
      if (phase < 0.5625) return '🌕';
      if (phase < 0.6875) return '🌖';
      if (phase < 0.8125) return '🌗';
      return '🌘';
    }

    // ---------- Pressure trend helpers ----------
    function getStoredTrend(loc) {
      if (typeof getTrend === 'function' && loc && loc.coordinates) {
        try {
          // getTrend expects the coord key and prepends the 'pt_' store prefix
          // itself, matching what recordPressure() writes in app.js.
          const key = `${loc.coordinates.lat.toFixed(3)}_${loc.coordinates.lng.toFixed(3)}`;
          return getTrend(key);
        } catch { /* fall through to stable */ }
      }
      return 'stable';
    }

    function trendModifier(trend) {
      if (trend === 'rising')  return 15;
      if (trend === 'falling') return -20;
      return 0;
    }

    function trendLabel(trend) {
      if (trend === 'rising')  return '↗️ Rising';
      if (trend === 'falling') return '↘️ Falling';
      return '↔️ Stable';
    }

    // ---------- Forecast ----------
    function renderForecast(loc) {
      const grid = document.getElementById('forecastGrid');
      if (!grid) return;
      grid.innerHTML = '';

      const trend    = getStoredTrend(loc);
      const modifier = trendModifier(trend);
      const today    = new Date();
      const PRESSURE_WINDOW = 5;

      for (let i = 0; i < 30; i++) {
        const date = new Date(today);
        date.setDate(today.getDate() + i);

        const phase     = getMoonPhase(date);
        const moonScore = 100 - (Math.abs((phase % 0.5) - 0.25) / 0.25 * 50);
        const useBlend  = i < PRESSURE_WINDOW;

        const blendedScore = useBlend
          ? Math.min(100, Math.max(0, moonScore * 0.7 + (50 + modifier) * 0.3))
          : moonScore;

        const color = blendedScore >= 70 ? 'bg-green-400'
                    : blendedScore >= 45 ? 'bg-yellow-300'
                    : 'bg-red-400';

        const ringClass = useBlend ? 'ring-2 ring-offset-1 ring-blue-400' : '';

        const dayEl = document.createElement('div');
        dayEl.className = `h-8 flex flex-col items-center justify-center rounded-md text-[10px] font-bold ${color} ${ringClass} border border-white/20 cursor-default`;
        dayEl.innerHTML = `<span>${date.getDate()}</span>`;

        const moonPct   = Math.round(phase * 100);
        const moonEmoji = getMoonIcon(phase);
        const scoreText = Math.round(blendedScore);
        dayEl.title = useBlend
          ? `${date.toLocaleDateString()} · ${moonEmoji} Moon ${moonPct}% · Pressure ${trendLabel(trend)} · Score: ${scoreText}`
          : `${date.toLocaleDateString()} · ${moonEmoji} Moon ${moonPct}% · Score: ${scoreText}`;

        grid.appendChild(dayEl);
      }

      const legendEl = document.getElementById('forecastLegend');
      if (legendEl) {
        legendEl.innerHTML = `
          <div class="flex items-center justify-center gap-1 mb-3">
            <span class="text-[10px] font-bold text-gray-500">Current pressure:</span>
            <span class="text-[10px] font-black text-blue-700">${trendLabel(trend)}</span>
            <span class="inline-block w-2 h-2 rounded-full bg-blue-400 ring-2 ring-blue-400 ring-offset-1 ml-1"></span>
            <span class="text-[10px] text-gray-400">= blended (days 1–5)</span>
          </div>
          <div class="flex gap-4 justify-center">
            <div class="flex items-center gap-1 text-[10px] font-bold"><div class="w-2 h-2 rounded bg-green-400"></div> Excellent</div>
            <div class="flex items-center gap-1 text-[10px] font-bold"><div class="w-2 h-2 rounded bg-yellow-300"></div> Good</div>
            <div class="flex items-center gap-1 text-[10px] font-bold"><div class="w-2 h-2 rounded bg-red-400"></div> Poor</div>
          </div>`;
      }
    }

    // ---------- Saved Spots ----------
    function getSavedSpots() {
      try { return JSON.parse(localStorage.getItem('savedSpots') || '[]'); } catch { return []; }
    }
    function renderSavedSpots() {
      const container = document.getElementById('savedContainer');
      const spots = getSavedSpots();
      if (spots.length === 0) {
        container.innerHTML = `<div class="text-center py-16 text-gray-400"><div class="text-4xl mb-3">🔖</div><p class="font-bold text-sm">No saved spots yet.</p><p class="text-xs mt-1">Hit the bookmark icon on any spot card to save it.</p></div>`;
        return;
      }
      container.innerHTML = spots.map(loc => `
        <div onclick="showDetailView('${loc.id}')" class="bg-white rounded-xl shadow-sm border p-4 flex gap-4 items-center cursor-pointer active:scale-[0.98] transition-all">
          <div class="w-14 h-14 bg-gray-100 rounded-lg flex items-center justify-center text-2xl">${loc.accessibility === 'Dock' ? '🛶' : '🏖️'}</div>
          <div class="flex-1">
            <h3 class="font-bold text-gray-800 leading-tight text-sm">${loc.name}</h3>
            <p class="text-[11px] text-gray-500 mt-0.5">${loc.region}</p>
          </div>
          <button onclick="event.stopPropagation(); unsaveSpot('${loc.id}')" class="text-red-400 hover:text-red-600 p-2 min-w-[44px] min-h-[44px] flex items-center justify-center">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M5 5a2 2 0 012-2h6a2 2 0 012 2v14l-5-2.5L5 19V5z"/></svg>
          </button>
        </div>
      `).join('');
    }
    function unsaveSpot(id) {
      const spots = getSavedSpots().filter(s => s.id !== id);
      localStorage.setItem('savedSpots', JSON.stringify(spots));
      renderSavedSpots();
    }
  </script>
</body>
</html>
